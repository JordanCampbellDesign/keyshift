<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Keyshift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <img src="images/icon32.png" class="logo" alt="Keyshift">
                <span class="header-title">Keyshift</span>
            </div>
            <div class="header-right">
                <button id="helpButton" class="icon-btn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts&#10;Up / Down: pitch&#10;Shift + Up / Down: fine tune&#10;[ / ]: tempo -5% / +5%&#10;Space: play or pause&#10;A / B: set loop points&#10;Esc: clear loop&#10;0: go to start&#10;R: reset pitch, tune, and tempo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6" y2="10"></line><line x1="10" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="14" y2="10"></line><line x1="18" y1="10" x2="18" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line></svg>
                </button>
                <button id="themeButton" class="icon-btn" title="Switch light or dark theme" aria-label="Switch light or dark theme">
                    <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
                    <svg id="themeIconMoon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button id="disconnectButton" class="icon-btn" title="Disconnect audio and close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </header>

        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="connectionDisplay" class="status-text">Disconnected</span>
        </div>

        <div id="playerControlsContainer" class="controls">
            <!-- Pitch -->
            <div class="control-group disabledState" data-control="pitch">
                <div class="control-header">
                    <span class="control-label">Pitch</span>
                    <span id="pitchShiftDisplay" class="control-value">0</span>
                    <button id="pitchReset" class="reset-btn" title="Reset Pitch" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
                <div class="slider-row">
                    <button class="step-btn pitchButton" value="-1" title="Decrease Pitch" disabled>&minus;</button>
                    <input id="pitchSlider" class="slider" type="range" disabled/>
                    <button class="step-btn pitchButton" value="1" title="Increase Pitch" disabled>+</button>
                </div>
            </div>

            <!-- Tune -->
            <div class="control-group disabledState" data-control="tune">
                <div class="control-header">
                    <span class="control-label">Tune</span>
                    <span id="tuneShiftDisplay" class="control-value">0.00</span>
                    <button id="tuneReset" class="reset-btn" title="Reset Tune" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
                <div class="slider-row">
                    <button class="step-btn tuneButton" value="-0.1" title="Decrease Tune" disabled>&minus;</button>
                    <input id="tuneSlider" class="slider" type="range" disabled/>
                    <button class="step-btn tuneButton" value="0.1" title="Increase Tune" disabled>+</button>
                </div>
            </div>

            <!-- Tempo -->
            <div class="control-group disabledState" data-control="tempo">
                <div class="control-header">
                    <span class="control-label">Tempo</span>
                    <span id="tempoDisplay" class="control-value">100%</span>
                    <span class="no-media-hint hidden" title="This site has no standard audio or video player, so Keyshift cannot control it. Pitch still works.">Not available</span>
                    <button id="tempoReset" class="reset-btn" title="Reset Tempo" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                </div>
                <div class="slider-row">
                    <button class="step-btn tempoButton" value="-0.02" title="Decrease Tempo" disabled>&minus;</button>
                    <input id="tempoSlider" class="slider" type="range" disabled/>
                    <button class="step-btn tempoButton" value="0.02" title="Increase Tempo" disabled>+</button>
                </div>
            </div>

            <!-- Stems -->
            <div class="control-group disabledState" data-control="stems" id="stemsGroup">
                <div class="control-header">
                    <span class="control-label">Stems</span>
                    <span class="stems-status" id="stemsStatus"></span>
                    <button id="stemsSeparate" class="stem-action-btn" disabled>Separate</button>
                </div>
                <div class="stems-progress hidden" id="stemsProgress">
                    <div class="progress-track">
                        <div class="progress-fill" id="stemsProgressFill"></div>
                    </div>
                    <span class="progress-text" id="stemsProgressText"></span>
                </div>
                <div class="stem-toggles hidden" id="stemToggles">
                    <button class="stem-toggle active" data-stem="vocals" disabled>Vocals</button>
                    <button class="stem-toggle active" data-stem="drums" disabled>Drums</button>
                    <button class="stem-toggle active" data-stem="bass" disabled>Bass</button>
                    <button class="stem-toggle active" data-stem="other" disabled>Other</button>
                </div>
            </div>

            <!-- Loop -->
            <div class="control-group disabledState" data-control="loop">
                <div class="control-header">
                    <span class="control-label">Loop</span>
                    <span class="no-media-hint hidden" title="This site has no standard audio or video player, so Keyshift cannot control it. Pitch still works.">Not available</span>
                    <div class="loop-controls">
                        <button class="loop-btn" id="loopButtonA" disabled>A</button>
                        <button class="loop-btn" id="loopButtonB" disabled>B</button>
                        <button id="loopReset" class="reset-btn" title="Clear Loop" disabled>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Speed ramp -->
            <div class="control-group disabledState" data-control="ramp">
                <div class="control-header">
                    <span class="control-label">Ramp</span>
                    <span class="no-media-hint hidden" title="This site has no standard audio or video player, so Keyshift cannot control it. Pitch still works.">Not available</span>
                    <label class="ramp-toggle" title="Each time the loop restarts, raise the tempo by the step until it reaches the target">
                        <input type="checkbox" id="rampToggle" disabled>
                        <span class="ramp-toggle-label">On</span>
                    </label>
                </div>
                <div class="ramp-row">
                    <label class="ramp-field">
                        <span class="ramp-field-label">Step %</span>
                        <input type="number" id="rampStep" class="ramp-input" min="1" max="50" step="1" value="5" disabled>
                    </label>
                    <label class="ramp-field">
                        <span class="ramp-field-label">Target %</span>
                        <input type="number" id="rampTarget" class="ramp-input" min="25" max="250" step="1" value="100" disabled>
                    </label>
                </div>
            </div>

            <!-- Transport -->
            <div id="playContainer" class="transport disabledState">
                <button class="transport-btn" id="skipBeginning" title="Seek to beginning" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="transport-btn" id="seekReverse" title="Rewind" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button class="play-btn" id="playPause" title="Play or pause" disabled>
                    <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                    <svg id="resyncIcon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                </button>
                <button class="transport-btn" id="seekForward" title="Fast Forward" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                </button>
            </div>

            <!-- Timeline -->
            <div id="timeline" class="timeline-container disabledState">
                <div id="timelineBar" class="timeline-bar" title="Click to seek">
                    <div id="timelineLoop" class="timeline-loop-region"></div>
                    <div id="timelineProgress" class="timeline-progress"></div>
                    <div id="markerA" class="timeline-marker timeline-marker-a"></div>
                    <div id="markerB" class="timeline-marker timeline-marker-b"></div>
                    <div id="timelinePlayhead" class="timeline-playhead"></div>
                </div>
            </div>

            <!-- Time -->
            <div id="timeDisplay" class="time-display disabledState">
                <span id="positionDisplay">--:--</span>
                <span class="time-separator">/</span>
                <span id="durationDisplay">--:--</span>
            </div>
        </div>
    </div>

    <div id="snackbar" class="snackbar"></div>

    <script src="popup.js"></script>
</body>
</html>
