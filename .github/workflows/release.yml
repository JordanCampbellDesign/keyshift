name: Release

# A person starts a release after merging fixes. The version must match extension/manifest.json
# and have a section in CHANGELOG.md. It packages the zip and publishes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          manifest=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if [ "$manifest" != "${{ inputs.version }}" ]; then
            echo "manifest.json says $manifest, not ${{ inputs.version }}"; exit 1
          fi
          grep -q "^## ${{ inputs.version }}$" CHANGELOG.md || { echo "CHANGELOG.md has no ${{ inputs.version }} section"; exit 1; }
      - name: Check and package
        run: |
          scripts/check.sh
          scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" "dist/keyshift-$VERSION.zip" --title "Keyshift $VERSION" --notes-file notes.md
